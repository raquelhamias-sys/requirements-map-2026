    EDGES.forEach(([a,b,s],idx)=>{ if(a===selected||b===selected){selEdges.add(idx);selNodes.add(a);selNodes.add(b);} }); }
  CL().forEach(c=>{
    const col=c.fire?FIRE:HIRE;
    const circ=document.createElementNS(SVG_NS,'circle');
    circ.setAttribute('cx',wx(c.cx));circ.setAttribute('cy',wy(c.cy));circ.setAttribute('r',(c.R+0.18)*SCALE);
    circ.setAttribute('fill',col);circ.setAttribute('fill-opacity','0.06');
    circ.setAttribute('stroke',col);circ.setAttribute('stroke-opacity','0.45');circ.setAttribute('stroke-width','1');
    scene.appendChild(circ);
    const t=document.createElementNS(SVG_NS,'text');
    t.setAttribute('x',wx(c.cx));t.setAttribute('y',wy(c.cy+c.R+0.30));
    t.setAttribute('text-anchor','middle');t.setAttribute('fill','#cfd6e2');
    t.setAttribute('font-size','13');t.setAttribute('font-weight','700');
    t.textContent=c.theme+'  ('+c.n+')'; scene.appendChild(t);
  });
  EDGES.forEach(([a,b,s],idx)=>{
    const x1=wx(pos[a][0]),y1=wy(pos[a][1]),x2=wx(pos[b][0]),y2=wy(pos[b][1]);
    const mx=(x1+x2)/2,my=(y1+y2)/2; const dx=x2-x1,dy=y2-y1;
    const cx=mx-dy*0.18, cy=my+dx*0.18;
    const p=document.createElementNS(SVG_NS,'path');
    p.setAttribute('d',`M${x1},${y1} Q${cx},${cy} ${x2},${y2}`);
    p.setAttribute('fill','none');
    const on = !selEdges || selEdges.has(idx);
    p.setAttribute('stroke',s==='strong'?'#f0b454':'#6ea8fe');
    p.setAttribute('stroke-width', on ? (s==='strong'?3.0:1.8) : (s==='strong'?2.4:1.2));
    p.setAttribute('stroke-opacity', selEdges ? (on?0.95:0.04) : (s==='strong'?0.6:0.4)); scene.appendChild(p);
  });
  NODES.forEach((n,i)=>{
    const dimmed = hidden.has(n[curDim]) || (selNodes && !selNodes.has(i));
    const g=document.createElementNS(SVG_NS,'g'); g.setAttribute('opacity',dimmed?0.1:1);
    const r=6+n.deg*3;
    const c=document.createElementNS(SVG_NS,'circle');
    c.setAttribute('cx',wx(pos[i][0]));c.setAttribute('cy',wy(pos[i][1]));c.setAttribute('r',r);
    c.setAttribute('fill',nodeColor(n));
    c.setAttribute('stroke', i===selected ? '#ffffff' : '#0f1115');
    c.setAttribute('stroke-width', i===selected ? '2.8' : '1.2');
    g.appendChild(c);
    const t=document.createElementNS(SVG_NS,'text');
    t.setAttribute('x',wx(pos[i][0]));t.setAttribute('y',wy(pos[i][1])+r+9);
    t.setAttribute('text-anchor','middle');t.setAttribute('fill','#dfe4ec');t.setAttribute('font-size','8');
    const short=n.name.replace(/\s*\(e\.g\..*?\)/,'');
    t.textContent=short.length>34?short.slice(0,33)+'…':short; g.appendChild(t);
    g.style.cursor='pointer';
    g.addEventListener('mousemove',e=>showTip(e,n));
    g.addEventListener('mouseleave',hideTip);
    g.addEventListener('click',e=>{ e.stopPropagation(); selected = (selected===i?null:i); render(); });
    scene.appendChild(g);
  });
}
function renderLegend(){
  const dim=DIMS.find(d=>d.key===curDim);
  document.getElementById('legtitle').textContent='Legend · '+dim.label;
  document.getElementById('leghint').textContent='Click a row to dim that group.';
  const counts={}; NODES.forEach(n=>{const v=n[curDim]|| (curDim==='s1'?'Firing (no job)':'(none)');counts[v]=(counts[v]||0)+1});
  const entries=Object.entries(counts).sort((a,b)=>b[1]-a[1]);
  const box=document.getElementById('legrows');box.innerHTML='';
  entries.forEach(([k,ct])=>{
    const row=document.createElement('div');row.className='lrow'+(hidden.has(k)?' off':'');
    const col=(k==='(none)'||k==='Firing (no job)')?'#3a4150':(colorMap[k]||'#3a4150');
    row.innerHTML=`<span class="sw" style="background:${col}"></span><span>${esc(k)}</span><span class="ct">${ct}</span>`;
    row.onclick=()=>{ if(k==='(none)'||k==='Firing (no job)')return; hidden.has(k)?hidden.delete(k):hidden.add(k); render();renderLegend(); };
    box.appendChild(row);
  });
}
const cb=document.getElementById('colorbtns');
DIMS.forEach(d=>{
  const b=document.createElement('span');b.className='btn'+(d.key===curDim?' on':'');
  b.textContent=d.label;b.onclick=()=>{
    const prevLayout=curLayout; curDim=d.key; curLayout=layoutFor(d.key); hidden.clear(); selected=null; buildColors();
    [...cb.children].forEach(x=>x.classList.remove('on'));b.classList.add('on');
    render();renderLegend();
    if(curLayout!==prevLayout) fit();
  };
  cb.appendChild(b);
});
const tip=document.getElementById('tip');
function showTip(e,n){
  const tags=[['Theme',n.s0],['Job to be Done',n.s1],['Locus',n.s2],['Psych',n.s3],['Lifecycle',n.s4],['Pipeline',n.s5]]
    .filter(([k,v])=>v).map(([k,v])=>`<span class="tag">${k}: ${esc(v)}</span>`).join(' ');
  const pc=n.type==='Hiring'?HIRE:FIRE;
  tip.innerHTML=`<b>${esc(n.name)}</b><br>
    <span class="pill" style="background:${pc}22;color:${pc}">${n.type}</span>
    &nbsp;<span style="color:var(--mut)">${esc(n.overlap||'')} · ${esc(n.age||'')}</span>
    <div style="margin-top:7px">${tags}</div>
    ${n.deg?`<div style="margin-top:6px;color:var(--mut)">${n.deg} overlap link(s)</div>`:''}`;
  tip.style.display='block';
  const pad=14;let x=e.clientX+pad,y=e.clientY+pad;
  if(x+310>innerWidth)x=e.clientX-310;
  if(y+160>innerHeight)y=e.clientY-160;
  tip.style.left=x+'px';tip.style.top=y+'px';
}
function hideTip(){tip.style.display='none'}
const svg=document.getElementById('svg');
let vt={x:0,y:0,k:1};
function applyT(){scene.setAttribute('transform',`translate(${vt.x},${vt.y}) scale(${vt.k})`)}
function fit(){
  const rw=svg.clientWidth,rh=svg.clientHeight;
  const k=Math.min(rw/W,rh/H)*0.94;
  vt.k=k; vt.x=(rw-W*k)/2; vt.y=(rh-H*k)/2; applyT();
}
svg.addEventListener('wheel',e=>{e.preventDefault();
  const r=svg.getBoundingClientRect();const mx=e.clientX-r.left,my=e.clientY-r.top;
  const f=Math.exp(-e.deltaY*0.0015);const nk=Math.min(8,Math.max(0.15,vt.k*f));
  vt.x=mx-(mx-vt.x)*(nk/vt.k);vt.y=my-(my-vt.y)*(nk/vt.k);vt.k=nk;applyT();
},{passive:false});
let drag=null, moved=false;
svg.addEventListener('mousedown',e=>{drag={x:e.clientX,y:e.clientY,vx:vt.x,vy:vt.y};moved=false;svg.classList.add('drag')});
addEventListener('mousemove',e=>{if(!drag)return;if(Math.abs(e.clientX-drag.x)+Math.abs(e.clientY-drag.y)>3)moved=true;vt.x=drag.vx+(e.clientX-drag.x);vt.y=drag.vy+(e.clientY-drag.y);applyT()});
addEventListener('mouseup',()=>{drag=null;svg.classList.remove('drag')});
svg.addEventListener('click',()=>{ if(moved){moved=false;return;} if(selected!=null){selected=null;render();} });
document.getElementById('zin').onclick=()=>{vt.k=Math.min(8,vt.k*1.3);applyT()};
document.getElementById('zout').onclick=()=>{vt.k=Math.max(0.15,vt.k/1.3);applyT()};
document.getElementById('zreset').onclick=fit;
document.getElementById('sub').textContent=
 `${NODES.length} requirements · `+
 `${NODES.filter(n=>n.type==='Hiring').length} Hiring · ${NODES.filter(n=>n.type==='Firing').length} Firing · `+
 `${EDGES.length} overlap links (gold = strong, blue = partial)`;
buildColors();render();renderLegend();
addEventListener('resize',fit); fit();
</script></body></html>
